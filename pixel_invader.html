<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pixel Invader</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#050509;color:#fff;font-family:"Courier New",monospace;
  display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;
}
#wrap{width:min(96vw,900px);text-align:center}
h1{margin:5px 0 2px;color:#54ff54;font-size:clamp(24px,5vw,42px);letter-spacing:4px;text-shadow:3px 3px #073b07}
#tag{font-size:12px;color:#aaa;margin-bottom:8px}
#hud{
 display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;
 font-weight:bold;font-size:14px;margin:7px 0;
}
#hud span{color:#54ff54}
#game{
 display:block;width:100%;height:auto;aspect-ratio:16/10;
 background:#000;border:4px solid #54ff54;image-rendering:pixelated;
 box-shadow:0 0 20px #183c18;
}
#controls{margin-top:9px;display:flex;justify-content:center;gap:10px}
button{
 background:#111;color:#54ff54;border:2px solid #54ff54;padding:10px 18px;
 font:bold 16px "Courier New";cursor:pointer;border-radius:5px;
}
button:active{transform:scale(.95);background:#183c18}
#help{font-size:11px;color:#888;margin-top:8px}
#overlay{
 position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;
 justify-content:center;padding:20px;z-index:5
}
.panel{
 border:3px solid #54ff54;background:#07070b;padding:25px;max-width:480px;
 box-shadow:0 0 30px #173817;text-align:center
}
.panel h2{color:#54ff54;font-size:30px;margin:0 0 10px}
.panel p{line-height:1.5;color:#ddd}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <h1>PIXEL INVADER</h1>
  <div id="tag">SHOOT. SURVIVE. BEAT THE HIGH SCORE!</div>
  <div id="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>LEVEL: <span id="level">1</span></div>
    <div>LIVES: <span id="lives">3</span></div>
    <div>HIGH: <span id="high">0</span></div>
  </div>
  <canvas id="game" width="800" height="500"></canvas>
  <div id="controls">
    <button id="left">◀ KIRI</button>
    <button id="fire">● TEMBAK</button>
    <button id="right">KANAN ▶</button>
  </div>
  <div id="help">Keyboard: ← → / A D untuk bergerak • SPACE untuk menembak • P untuk pause</div>
</div>

<div id="overlay">
  <div class="panel">
    <h2 id="title">PIXEL INVADER</h2>
    <p id="message">Bertahan dari pasukan alien pixel dan raih skor setinggi mungkin!</p>
    <button id="start">MULAI GAME</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

const scoreEl=document.getElementById("score"), levelEl=document.getElementById("level"),
livesEl=document.getElementById("lives"), highEl=document.getElementById("high");
const overlay=document.getElementById("overlay"), title=document.getElementById("title"),
message=document.getElementById("message"), startBtn=document.getElementById("start");

let high=Number(localStorage.getItem("pixelInvaderHigh")||0);
highEl.textContent=high;

let keys={}, bullets=[], enemyBullets=[], enemies=[], particles=[];
let score=0,lives=3,level=1,playing=false,paused=false,last=0,spawnTimer=0,fireTimer=0;
let stars=Array.from({length:90},()=>({x:Math.random()*800,y:Math.random()*500,s:Math.random()<.75?1:2,v:20+Math.random()*45}));

const player={x:400,y:450,w:34,h:24,speed:330};

function reset(){
 score=0;lives=3;level=1;bullets=[];enemyBullets=[];enemies=[];particles=[];
 player.x=400;spawnTimer=0;fireTimer=0;paused=false;
 updateHud(); createWave();
}
function updateHud(){
 scoreEl.textContent=score;levelEl.textContent=level;livesEl.textContent=lives;highEl.textContent=high;
}
function createWave(){
 enemies=[];
 const count=Math.min(7+level,14);
 const cols=Math.min(7,count), rows=Math.ceil(count/cols);
 for(let r=0;r<rows;r++)for(let c=0;c<cols&&r*cols+c<count;c++){
   enemies.push({x:110+c*92,y:65+r*48,w:34,h:25,
     vx:(level%2?1:-1)*(35+level*5),hp:1});
 }
}
function shoot(){
 if(!playing||paused||fireTimer>0)return;
 bullets.push({x:player.x,y:player.y-18,w:4,h:13,v:-520});
 fireTimer=.22;
}
function enemyShoot(e){
 enemyBullets.push({x:e.x,y:e.y+16,w:4,h:11,v:180+level*12});
}
function hit(a,b){
 return Math.abs(a.x-b.x)<(a.w+b.w)/2 && Math.abs(a.y-b.y)<(a.h+b.h)/2;
}
function explosion(x,y){
 for(let i=0;i<12;i++)particles.push({
  x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.45+Math.random()*.35
 });
}
function addScore(n){
 score+=n;
 if(score>high){high=score;localStorage.setItem("pixelInvaderHigh",high)}
 const newLevel=Math.floor(score/500)+1;
 if(newLevel>level){level=newLevel;createWave()}
 updateHud();
}
function loseLife(){
 lives--;explosion(player.x,player.y);player.x=400;updateHud();
 if(lives<=0)gameOver();
}
function gameOver(){
 playing=false;title.textContent="GAME OVER";
 message.textContent=`Skor kamu: ${score}. High Score: ${high}.`;
 startBtn.textContent="MAIN LAGI";overlay.classList.remove("hidden");
}
function startGame(){
 reset();playing=true;overlay.classList.add("hidden");last=performance.now();requestAnimationFrame(loop);
}
startBtn.onclick=startGame;

function update(dt){
 for(const s of stars){s.y+=s.v*dt;if(s.y>500)s.y=0}
 if(keys.ArrowLeft||keys.a||keys.A)player.x-=player.speed*dt;
 if(keys.ArrowRight||keys.d||keys.D)player.x+=player.speed*dt;
 player.x=Math.max(22,Math.min(778,player.x));
 fireTimer-=dt;if(keys[" "]||keys.Space)shoot();

 spawnTimer-=dt;
 const enemySpeed=35+level*5;
 let edge=false;
 for(const e of enemies){e.x+=e.vx*dt;if(e.x<25||e.x>775)edge=true}
 if(edge)for(const e of enemies){e.y+=18;e.vx*=-1}

 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];b.y+=b.v*dt;
  if(b.y<-20){bullets.splice(i,1);continue}
  let removed=false;
  for(let j=enemies.length-1;j>=0;j--){
   if(hit(b,enemies[j])){
    explosion(enemies[j].x,enemies[j].y);enemies.splice(j,1);bullets.splice(i,1);
    addScore(100);removed=true;break;
   }
  }
  if(removed)continue;
 }

 if(level>=4 && spawnTimer<=0 && enemies.length){
  enemyShoot(enemies[Math.floor(Math.random()*enemies.length)]);
  spawnTimer=Math.max(.35,1.5-level*.08);
 }
 for(let i=enemyBullets.length-1;i>=0;i--){
  const b=enemyBullets[i];b.y+=b.v*dt;
  if(b.y>530){enemyBullets.splice(i,1);continue}
  if(hit(b,player)){enemyBullets.splice(i,1);loseLife()}
 }
 for(const e of enemies)if(e.y>player.y-15){loseLife();break}
 if(!enemies.length)createWave();

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }
}
function drawPixelShip(){
 ctx.fillStyle="#54ff54";
 ctx.fillRect(player.x-5,player.y-18,10,5);
 ctx.fillRect(player.x-11,player.y-13,22,6);
 ctx.fillRect(player.x-17,player.y-7,34,7);
 ctx.fillStyle="#baffba";ctx.fillRect(player.x-3,player.y-13,6,6);
}
function drawAlien(e){
 ctx.fillStyle="#ff4dff";
 ctx.fillRect(e.x-15,e.y-10,30,6);
 ctx.fillRect(e.x-11,e.y-15,6,6);ctx.fillRect(e.x+5,e.y-15,6,6);
 ctx.fillRect(e.x-18,e.y-4,36,10);
 ctx.fillStyle="#000";ctx.fillRect(e.x-9,e.y-2,5,5);ctx.fillRect(e.x+4,e.y-2,5,5);
 ctx.fillStyle="#ff4dff";ctx.fillRect(e.x-14,e.y+6,6,7);ctx.fillRect(e.x+8,e.y+6,6,7);
}
function draw(){
 ctx.fillStyle="#000";ctx.fillRect(0,0,800,500);
 ctx.fillStyle="#fff";
 for(const s of stars)ctx.fillRect(s.x,s.y,s.s,s.s);
 for(const b of bullets){ctx.fillStyle="#ffff55";ctx.fillRect(b.x-2,b.y-7,4,14)}
 for(const b of enemyBullets){ctx.fillStyle="#ff5555";ctx.fillRect(b.x-2,b.y-6,4,12)}
 for(const e of enemies)drawAlien(e);
 drawPixelShip();
 for(const p of particles){
  ctx.fillStyle="#ffff55";ctx.fillRect(p.x,p.y,4,4);
 }
 if(paused){
  ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,800,500);
  ctx.fillStyle="#54ff54";ctx.font="bold 42px monospace";ctx.textAlign="center";ctx.fillText("PAUSED",400,250);
 }
}
function loop(t){
 if(!playing)return;
 const dt=Math.min((t-last)/1000,.033);last=t;
 if(!paused)update(dt);draw();requestAnimationFrame(loop);
}
window.addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(["ArrowLeft","ArrowRight"," ","Space"].includes(e.key))e.preventDefault();
 if(e.key.toLowerCase()==="p"&&playing)paused=!paused;
 if(e.key===" "||e.key==="Space")shoot();
});
window.addEventListener("keyup",e=>keys[e.key]=false);

function hold(btn,key){
 const down=e=>{e.preventDefault();keys[key]=true;if(key===" ")shoot()};
 const up=e=>{e.preventDefault();keys[key]=false};
 ["pointerdown","touchstart"].forEach(x=>btn.addEventListener(x,down,{passive:false}));
 ["pointerup","pointercancel","pointerleave","touchend"].forEach(x=>btn.addEventListener(x,up,{passive:false}));
}
hold(document.getElementById("left"),"ArrowLeft");
hold(document.getElementById("right"),"ArrowRight");
hold(document.getElementById("fire")," ");

draw();
</script>
</body>
</html>
